# Установка: скопировать в /etc/nginx/sites-available/panel.example.com.conf,
# затем: ln -s ../sites-available/panel.example.com.conf /etc/nginx/sites-enabled/
# Существующие конфиги других сайтов НЕ трогать — это отдельный, независимый vhost
# на первом (обычном) IP, порт не пересекается с Reality-инбаундом (тот на втором IP).
#
# Перед первым запуском certbot: временный http-блок ниже достаточен для ACME HTTP-01.
# Затем: certbot --nginx -d panel.example.com

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.example.com;

    # certbot допишет ssl_certificate/ssl_certificate_key сюда автоматически
    ssl_certificate /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    root /var/www/panel/public;
    index index.php;

    # Ограничение доступа по IP (раскомментировать и заполнить, рекомендуется):
    # allow 203.0.113.0/24;
    # deny all;

    access_log /var/log/nginx/panel.access.log;
    error_log  /var/log/nginx/panel.error.log;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param PANEL_CONFIG_PATH /etc/panel/config.php;
    }

    location ~ /\. {
        deny all;
    }
}
